name: Native portability
on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
        sanitizer: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build flex bison pkg-config libfreetype6-dev libfontconfig1-dev fonts-liberation libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev xvfb xauth weston
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake --preset native-debug -DNOLF_SANITIZERS=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build --preset native-debug --parallel 4
      - name: Test
        run: ctest --preset native-debug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-${{ matrix.compiler }}-${{ matrix.sanitizer }}-logs
          path: |
            out/native-debug/Testing/Temporary/
            out/native-debug/native-audit.json
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build flex bison
      - run: cmake --preset native-headless
      - run: cmake --build --preset native-headless --parallel 4
      - run: ctest --preset native-headless
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install pinned native parser generators
        shell: pwsh
        run: |
          $nolfParserArchive = "$env:RUNNER_TEMP/nolf-parser-tools.zip"
          $nolfParserTools = "$env:RUNNER_TEMP/nolf-parser-tools"
          Invoke-WebRequest https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip -OutFile $nolfParserArchive
          if ((Get-FileHash $nolfParserArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8d324b62be33604b2c45ad1dd34ab93d722534448f55a16ca7292de32b6ac135') { throw 'Parser tool checksum mismatch' }
          Expand-Archive $nolfParserArchive -DestinationPath $nolfParserTools
          $nolfParserTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cmake --preset native-debug
      - run: cmake --build --preset native-debug --parallel 4
      - run: ctest --preset native-debug
